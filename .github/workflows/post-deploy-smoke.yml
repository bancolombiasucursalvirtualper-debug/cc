name: Post-deploy relay security smoke test
on:
  push:
    branches: [verification/post-deploy-smoke]
permissions:
  contents: read
jobs:
  post-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deployed relay and deny legacy query credentials
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://cc-production-0fde.up.railway.app/)"
          status_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://cc-production-0fde.up.railway.app/status)"
          query_start_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' 'https://cc-production-0fde.up.railway.app/start?u=https%3A%2F%2Fexample.com%2Ftest.m3u8&k=not-a-key')"
          query_fetch_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' 'https://cc-production-0fde.up.railway.app/fetch?u=https%3A%2F%2Fexample.com%2F&k=not-a-key')"
          unauth_post_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://cc-production-0fde.up.railway.app/start)"
          test "$health_code" = "200"
          test "$status_code" = "403"
          test "$query_start_code" = "403"
          test "$query_fetch_code" = "403"
          test "$unauth_post_code" = "403"
          echo "Relay checks passed: health is live; /status, query-key auth, and unauthenticated POST are rejected."

      - name: Verify deployed MiTube active-plan guard
        shell: bash
        run: |
          set -euo pipefail
          plan_guard_code="$(curl -sS --max-time 30 -o /tmp/plan-guard.json -w '%{http_code}' 'https://youtube-com-co.lovable.app/api/public/colombia/play?id=25')"
          if [ "$plan_guard_code" != "403" ]; then
            echo "Expected an unauthenticated request to be denied with HTTP 403; got $plan_guard_code"
            cat /tmp/plan-guard.json
            exit 1
          fi
          echo "MiTube guard passed: anonymous playback request is denied."
