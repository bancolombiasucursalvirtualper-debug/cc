name: Relay syntax check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/relay-auth-header]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
