name: Relay syntax check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/relay-auth-header]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - name: Smoke test live relay
        if: github.ref == 'refs/heads/security/relay-auth-header'
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl -sS -o /tmp/relay-health.txt -w '%{http_code}' https://cc-production-0fde.up.railway.app/)"
          test "$health_code" = "200"
          status_code="$(curl -sS -o /tmp/relay-status.txt -w '%{http_code}' https://cc-production-0fde.up.railway.app/status)"
          test "$status_code" = "403"
