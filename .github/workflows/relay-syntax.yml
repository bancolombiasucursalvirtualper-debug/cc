name: Relay syntax and auth tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/remove-query-key-auth]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js

      - name: Verify Bearer auth and reject query credentials locally
        shell: bash
        run: |
          set -euo pipefail
          PORT=18765 RELAY_KEY=ci-test-secret node server.js >/tmp/relay-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null http://127.0.0.1:18765/; then break; fi
            sleep 1
          done

          health_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/)"
          status_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/status)"
          old_start_code="$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18765/start?u=https%3A%2F%2Fexample.com%2Ftest.m3u8&k=ci-test-secret')"
          old_fetch_code="$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18765/fetch?u=https%3A%2F%2Fexample.com%2F&k=ci-test-secret')"
          unauth_post_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:18765/start)"
          bearer_post_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-test-secret' -H 'content-type: application/json' -d '{}' http://127.0.0.1:18765/start)"

          test "$health_code" = "200"
          test "$status_code" = "403"
          test "$old_start_code" = "403"
          test "$old_fetch_code" = "403"
          test "$unauth_post_code" = "403"
          test "$bearer_post_code" = "400"
          echo "Local auth checks passed: Bearer accepted; query-key and unauthenticated requests rejected."

      - name: Smoke test live relay and published Colombia playback
        if: github.ref == 'refs/heads/security/remove-query-key-auth'
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://cc-production-0fde.up.railway.app/)"
          status_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://cc-production-0fde.up.railway.app/status)"
          test "$health_code" = "200"
          test "$status_code" = "403"

          play_code="$(curl -sS --max-time 45 -o /tmp/colombia-play.json -w '%{http_code}' 'https://youtube-com-co.lovable.app/api/public/colombia/play?id=25')"
          if [ "$play_code" != "200" ]; then
            echo "Colombia play API returned HTTP $play_code"
            node -e 'const d=require("/tmp/colombia-play.json"); console.log("API error:", d.error || "unspecified")'
            exit 1
          fi

          playlist="$(node -e 'const d=require("/tmp/colombia-play.json"); if (typeof d.playlist !== "string") process.exit(1); console.log(d.playlist)')"
          case "$playlist" in
            https://cc-production-0fde.up.railway.app/hls/*/live.m3u8) ;;
            *) echo "Play API returned an unexpected playlist URL"; exit 1 ;;
          esac

          playlist_code="$(curl -sS --max-time 25 -o /tmp/colombia-playlist.m3u8 -w '%{http_code}' "$playlist")"
          if [ "$playlist_code" != "200" ] || ! grep -q '^#EXTM3U' /tmp/colombia-playlist.m3u8; then
            echo "HLS playlist check failed (HTTP $playlist_code)"
            exit 1
          fi

          segment="$(awk '!/^#/ && NF { print; exit }' /tmp/colombia-playlist.m3u8)"
          if [ -z "$segment" ]; then
            echo "HLS playlist had no media segment yet"
            exit 1
          fi
          segment_url="$(node -e 'console.log(new URL(process.argv[1], process.argv[2]).href)' "$segment" "$playlist")"
          segment_code="$(curl -sS --max-time 25 -o /tmp/colombia-segment.ts -w '%{http_code}' "$segment_url")"
          if [ "$segment_code" != "200" ] || [ ! -s /tmp/colombia-segment.ts ]; then
            echo "HLS segment check failed (HTTP $segment_code)"
            exit 1
          fi
          echo "End-to-end playback passed: play API, HLS playlist, and media segment returned successfully."
